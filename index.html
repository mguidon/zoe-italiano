<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🇮🇹 Italienisch lernen – Hören und Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="float f1">🍕</span>
    <span class="float f2">🍦</span>
    <span class="float f3">🛵</span>
    <span class="float f4">🏛️</span>
    <span class="float f5">⛲</span>
    <span class="float f6">🎒</span>
    <span class="blob blob1"></span>
    <span class="blob blob2"></span>
    <span class="blob blob3"></span>
  </div>
  <div class="flag-stripe" aria-hidden="true"><i></i><i></i><i></i></div>

  <header>
    <div class="logo-chip">🇮🇹</div>
    <h1>Zoe lernt <span class="it-word">Italiano!</span></h1>
    <p class="subtitle">Hör dir das Gespräch an, dann mach das Quiz!</p>
  </header>

  <main>
    <!-- Step 1: topic selection -->
    <section id="topic-screen">
      <h2>Wähle ein Thema</h2>
      <div id="topic-list" class="topic-grid"></div>
    </section>

    <!-- Step 2: conversation listening -->
    <section id="conversation-screen" class="hidden">
      <button id="back-btn" class="back-btn">← Themen</button>
      <h2 id="conv-title"></h2>

      <div class="controls card">
        <button id="play-all-btn" class="big-btn">▶️ Alles anhören</button>
        <button id="stop-btn" class="big-btn secondary">⏹ Stopp</button>
        <div class="speed-row">
          <label for="speed">🐢 Langsam</label>
          <input type="range" id="speed" min="0.6" max="1.2" step="0.05" value="0.9" />
          <label for="speed">Schnell 🐇</label>
        </div>
        <div class="toggle-row">
          <label><input type="checkbox" id="show-text" /> �️ Dialogtext anzeigen</label>
        </div>
        <div class="toggle-row" id="translation-row">
          <label><input type="checkbox" id="show-translation" /> Zeige Übersetzung</label>
        </div>
        <div id="voice-warning" class="voice-warning hidden"></div>
      </div>

      <div id="dialogue" class="dialogue"></div>

      <div class="next-row">
        <button id="quiz-btn" class="big-btn go hidden">📝 Zum Quiz!</button>
      </div>
    </section>

    <!-- Step 3: quiz -->
    <section id="quiz-screen" class="hidden">
      <button id="back-to-conv-btn" class="back-btn">← Nochmal anhören</button>
      <h2 id="quiz-title"></h2>
      <div id="quiz-progress" class="quiz-progress"></div>
      <div id="quiz-card" class="card quiz-card"></div>
      <div id="quiz-result" class="card quiz-result hidden"></div>
    </section>
  </main>

  <footer>
    <small>Native italienische Stimmen · Funktioniert am besten in Microsoft Edge (Stimmen „Elsa“ &amp; „Diego“) oder Google Chrome.</small>
  </footer>

  <div id="confetti-layer" aria-hidden="true"></div>

  <script src="topics.js"></script>
  <script src="app.js"></script>
</body>
</html>
